  * { box-sizing: border-box; }

  .btn.sec, button.sec { background:#e3eadf; color:var(--ink); }

  </header>
</div>
<main>
  <div id="app"><div class="card muted" style="text-align:center">Carregando…</div></div>
  <footer>Cada pessoa só vê quem tirou no próprio link secreto.</footer>
</main>

<script>
// ====== CONFIGURAÇÃO ======
const SUPABASE_URL = "https://sdjeaddpdoldbnlsctuj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkamVhZGRwZG9sZGJubHNjdHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3ODExODIsImV4cCI6MjExMDM1NzE4Mn0.WZMLed5H-gvttN_97ks4Tv4TuZNm5aIGVuF4jQrDsD0";
// Grupos com mais de 50 pessoas são pagos. Preencha para mostrar as instruções de pagamento.
const PRECO_GRUPO_GRANDE = "9.90"; // valor em reais, com ponto
const PIX_CHAVE = "3f356cfd-d741-4f48-8a83-37194168820f";
const CONTATO_PAGAMENTO = "geanineiandra@gmail.com";
// ==========================

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const baseUrl = location.origin + location.pathname;
const params = new URLSearchParams(location.search);

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify(args || {})
  });
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) throw new Error((data && data.message) || "Erro ao falar com o servidor");
  return data;
}

function store(key, val) { try { val === undefined ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch {} }
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = "Copiado!"; setTimeout(() => btn.textContent = o, 1500); }
}

function contactLinks(contato, msg, subject) {
  const c = (contato || "").trim();
  if (!c) return null;
  if (c.includes("@")) return { kind: "email", href: `mailto:${encodeURIComponent(c)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}` };
  let d = c.replace(/\D/g, "");
  if (d.length === 10 || d.length === 11) d = "55" + d; // número brasileiro sem DDI
  if (d.length < 10) return null;
  return { kind: "wa", href: `https://wa.me/${d}?text=${encodeURIComponent(msg)}` };
}

function infoLine(g) {
  const parts = [];
  if (g.valor) parts.push(`<b>Valor:</b> ${esc(g.valor)}`);
  if (g.data_evento) parts.push(`<b>Data:</b> ${esc(g.data_evento)}`);
  return parts.length ? `<div class="info">${parts.map(p => `<span>${p}</span>`).join("")}</div>` : "";
}

// ---------- Tela inicial: criar grupo ----------
function renderHome() {
  const saved = JSON.parse(load("amigo_grupos") || "[]");
  $app.innerHTML = `
    <div class="card">
      <h2>Criar um amigo secreto</h2>
      <form id="f">
        <label for="nome">Nome do grupo</label>
        <input id="nome" required maxlength="120" placeholder="Ex.: Natal da família 2026">
        <div class="row">
          <div><label for="valor">Valor do presente (opcional)</label><input id="valor" maxlength="60" placeholder="Ex.: até R$ 100"></div>
          <div><label for="data">Data da troca (opcional)</label><input id="data" maxlength="60" placeholder="Ex.: 24/12 às 20h"></div>
        </div>
        <button class="full" type="submit">Criar grupo</button>
        <div id="msg"></div>
      </form>
    </div>
    ${saved.length ? `<div class="card"><h2>Seus grupos neste aparelho</h2><ul class="people">${saved.map(s =>
      `<li><a href="?g=${esc(s.t)}">${esc(s.n)}</a></li>`).join("")}</ul></div>` : ""}
    <div class="card">
      <h2>Como funciona</h2>
      <ol class="muted" style="margin:0;padding-left:20px">
        <li>Crie o grupo e cadastre os participantes com WhatsApp ou e-mail.</li>
        <li>Mande para cada pessoa o link secreto dela. Lá ela escreve o que quer ganhar.</li>
        <li>Clique em <b>Sortear</b>. Ninguém tira a si mesmo.</li>
        <li>Avise todo mundo: cada link passa a mostrar quem a pessoa tirou e a lista de desejos do amigo.</li>
      </ol>
    </div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    try {
      const nome = document.getElementById("nome").value;
      const r = await rpc("criar_grupo", { p_nome: nome, p_valor: document.getElementById("valor").value, p_data: document.getElementById("data").value });
      saved.unshift({ t: r.admin_token, n: nome.trim() });
      store("amigo_grupos", JSON.stringify(saved.slice(0, 20)));
      location.search = "?g=" + r.admin_token + "&novo=1";
    } catch (err) { document.getElementById("msg").innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; }
  };
}

// ---------- Painel do organizador ----------
async function renderAdmin(admin) {
  let g;
  try { g = await rpc("ver_grupo", { p_admin: admin }); }
  catch (err) { $app.innerHTML = `<div class="card"><div class="err">${esc(err.message)}</div><a class="btn sec full" href="${esc(baseUrl)}">Voltar</a></div>`; return; }
  document.getElementById("title").textContent = g.nome;
  document.getElementById("subtitle").textContent = g.sorteado ? "Sorteio feito! Agora avise cada pessoa." : "Painel do organizador";
  const adminLink = `${baseUrl}?g=${admin}`;
  const isNew = params.get("novo") === "1";
  const n = g.participantes.length;
  const comDesejos = g.participantes.filter(p => p.tem_desejos).length;

  const people = g.participantes.map(p => {
    const link = `${baseUrl}?p=${p.token}`;
    const msg = g.sorteado
      ? `Oi, ${p.nome}! O sorteio do amigo secreto "${g.nome}" foi feito!\nAbra seu link secreto para ver quem você tirou e o que a pessoa quer ganhar (não mostre pra ninguém!):\n${link}`
      : `Oi, ${p.nome}! Você está no amigo secreto "${g.nome}".\nAbra seu link secreto e escreva o que você quer ganhar. Depois do sorteio, é nesse mesmo link que você vai ver quem tirou:\n${link}`;
    const c = contactLinks(p.contato, msg, `Amigo secreto: ${g.nome}`);
    return `<li>
      <span class="pname">${esc(p.nome)}</span>
      <span class="tag ${p.tem_desejos ? "yes" : ""}">${p.tem_desejos ? "lista preenchida" : "sem lista ainda"}</span>
      ${p.contato ? `<div class="muted">${esc(p.contato)}</div>` : ""}
      <div class="actions">
        ${c ? `<a class="btn sm ${c.kind === "wa" ? "wa" : ""}" href="${esc(c.href)}" target="_blank" rel="noopener">${c.kind === "wa" ? "Enviar no WhatsApp" : "Enviar por e-mail"}</a>` : ""}
        <button class="sm sec" data-copy="${esc(msg)}">Copiar mensagem</button>
        ${g.sorteado ? "" : `<button class="sm sec" data-del="${esc(p.id)}" data-name="${esc(p.nome)}">Remover</button>`}
      </div>
    </li>`;
  }).join("");

  $app.innerHTML = `
    ${isNew ? `<div class="card ok" style="margin-top:0"><b>Grupo criado!</b> Guarde o link do painel abaixo: é com ele que você volta para gerenciar o grupo.</div>` : ""}
    <div class="card">
      <h2>Link do seu painel (só para você)</h2>
      <div class="linkbox"><input readonly value="${esc(adminLink)}"><button class="sm sec" id="cpAdmin">Copiar</button></div>
      ${infoLine(g)}
    </div>
    ${g.sorteado ? "" : `
    <div class="card">
      <h2>Adicionar participante</h2>
      <form id="addf">
        <div class="row">
          <div><label for="pn">Nome</label><input id="pn" required maxlength="80" placeholder="Ex.: Maria"></div>
          <div><label for="pc">WhatsApp ou e-mail</label><input id="pc" maxlength="120" placeholder="(11) 98765-4321 ou maria@email.com"></div>
        </div>
        <button class="full" type="submit">Adicionar</button>
        <div id="addmsg"></div>
      </form>
    </div>`}
    <div class="card">
      <h2>Participantes (${n}${g.premium ? "" : " de 50 grátis"})</h2>
      ${n ? `<p class="muted" style="margin-top:-6px">${comDesejos} de ${n} já preencheram a lista de desejos.</p><ul class="people">${people}</ul>` : `<p class="muted">Ninguém ainda. Adicione pelo menos 3 pessoas.</p>`}
    </div>
    <div class="card">
      ${g.sorteado ? `
        <h2>Sorteio feito</h2>
        <p class="muted">Use os botões acima para avisar cada pessoa. Ninguém, nem você, vê o resultado aqui no painel.</p>
        <button class="sec full" id="undo">Desfazer sorteio</button>
        <div id="undoConfirm" class="hidden"><p class="err">Desfazer apaga o resultado atual. Quem já viu quem tirou vai ver outra pessoa depois de um novo sorteio. Tem certeza?</p>
          <div class="row"><button id="undoYes">Sim, desfazer</button><button class="sec" id="undoNo">Cancelar</button></div></div>`
      : `
        <h2>Sortear</h2>
        <p class="muted">Dica: espere todo mundo preencher a lista de desejos. As listas continuam editáveis depois do sorteio.</p>
        <button class="full" id="draw" ${n < 3 ? "disabled" : ""}>Sortear agora</button>
        <div id="drawConfirm" class="hidden"><p class="muted">Depois do sorteio não dá para adicionar ou remover pessoas sem desfazê-lo. Confirmar?</p>
          <div class="row"><button id="drawYes">Sim, sortear</button><button class="sec" id="drawNo">Cancelar</button></div></div>`}
      <div id="drawmsg"></div>
    </div>`;

  const showErr = (id, err) => document.getElementById(id).innerHTML = `<div class="err">${esc(err.message)}</div>`;
  document.getElementById("cpAdmin").onclick = e => copy(adminLink, e.target);
  $app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy, b));
  $app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirmar remoção"; return; }
    b.disabled = true;
    try { await rpc("remover_participante", { p_admin: admin, p_id: b.dataset.del }); renderAdmin(admin); }
    catch (err) { alert(err.message); b.disabled = false; }
  });
  const addf = document.getElementById("addf");
  if (addf) addf.onsubmit = async e => {
    e.preventDefault();
    const btn = addf.querySelector("button"); btn.disabled = true;
    try {
      await rpc("adicionar_participante", { p_admin: admin, p_nome: document.getElementById("pn").value, p_contato: document.getElementById("pc").value });
      await renderAdmin(admin);
      document.getElementById("pn")?.focus();
    } catch (err) {
      if (err.message === "LIMITE_GRATIS") document.getElementById("addmsg").innerHTML = limiteMsg(g.codigo);
      else showErr("addmsg", err);
      btn.disabled = false;
    }
  };
  const toggle = (a, b) => { document.getElementById(a).classList.add("hidden"); document.getElementById(b).classList.remove("hidden"); };
  if (g.sorteado) {
    document.getElementById("undo").onclick = () => toggle("undo", "undoConfirm");
    document.getElementById("undoNo").onclick = () => toggle("undoConfirm", "undo");
    document.getElementById("undoYes").onclick = async e => {
      e.target.disabled = true;
      try { await rpc("desfazer_sorteio", { p_admin: admin }); renderAdmin(admin); } catch (err) { showErr("drawmsg", err); }
    };
  } else {
    document.getElementById("draw").onclick = () => toggle("draw", "drawConfirm");
    document.getElementById("drawNo").onclick = () => toggle("drawConfirm", "draw");
    document.getElementById("drawYes").onclick = async e => {
      e.target.disabled = true;
      try { await rpc("sortear", { p_admin: admin }); history.replaceState(null, "", "?g=" + admin); params.delete("novo"); await renderAdmin(admin); window.scrollTo(0, 0); }
      catch (err) { showErr("drawmsg", err); e.target.disabled = false; }
    };
  }
}

// Pix "copia e cola" (BR Code estático)
function pixPayload(chave, valor, txid) {
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const conta = f("00", "br.gov.bcb.pix") + f("01", chave);
  let p = f("00", "01") + f("26", conta) + f("52", "0000") + f("53", "986") + f("54", valor) +
          f("58", "BR") + f("59", "AMIGO SECRETO") + f("60", "SAO PAULO") + f("62", f("05", txid)) + "6304";
  let crc = 0xFFFF;
  for (let i = 0; i < p.length; i++) { crc ^= p.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return p + crc.toString(16).toUpperCase().padStart(4, "0");
}

function limiteMsg(codigo) {
  const box = document.createElement("div");
  if (!(PRECO_GRUPO_GRANDE && PIX_CHAVE)) {
    box.innerHTML = `<div class="err"><b>O plano grátis vai até 50 pessoas.</b> Grupos maiores serão um recurso pago em breve.</div>`;
    return box.innerHTML;
  }
  const txid = "GRUPO" + String(codigo).replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  const payload = pixPayload(PIX_CHAVE, PRECO_GRUPO_GRANDE, txid);
  const preco = "R$ " + PRECO_GRUPO_GRANDE.replace(".", ",");
  setTimeout(() => {
    const el = document.getElementById("pixqr");
    if (el && window.QRCode) new QRCode(el, { text: payload, width: 200, height: 200 });
    const b = document.getElementById("pixcopy"); if (b) b.onclick = () => copy(payload, b);
  });
  return `<div class="card" style="margin-top:12px;border-color:#d6e0d3;background:#f1f5ef">
    <b>O plano grátis vai até 50 pessoas.</b>
    <p style="margin:6px 0">Para liberar este grupo (até 500 pessoas), pague <b>${esc(preco)}</b> no Pix pelo QR code ou pelo copia e cola.
    ${CONTATO_PAGAMENTO ? `Depois mande o comprovante para <b>${esc(CONTATO_PAGAMENTO)}</b> com o código <b>${esc(codigo)}</b>.` : `Guarde o código do grupo: <b>${esc(codigo)}</b>.`}
    O grupo é liberado logo após a confirmação.</p>
    <div id="pixqr" style="display:flex;justify-content:center;margin:12px 0"></div>
    <div class="linkbox"><input readonly value="${esc(payload)}"><button type="button" class="sm sec" id="pixcopy">Copiar Pix</button></div>
  </div>`;
}

// ---------- Página do participante ----------
async function renderParticipant(token) {
  let p;
  try { p = await rpc("ver_participante", { p_token: token }); }
  catch (err) { $app.innerHTML = `<div class="card"><div class="err">${esc(err.message)}. Confira se você abriu o link completo que recebeu.</div></div>`; return; }
  document.getElementById("title").textContent = `Olá, ${p.nome}!`;
  document.getElementById("subtitle").textContent = `Amigo secreto: ${p.grupo}`;

  $app.innerHTML = `
    <div class="card">
      ${p.sorteado && p.amigo ? `
        <h2>Seu amigo secreto</h2>
        <div id="cover" class="reveal">
          <div>Pronto para descobrir?</div>
          <button class="sec" style="margin-top:12px" id="show">Toque para revelar</button>
        </div>
        <div id="result" class="reveal hidden">
          <div>Você tirou</div>
          <div class="big">${esc(p.amigo.nome)}</div>
          <div class="wishes">${p.amigo.desejos ? `<b>O que ${esc(p.amigo.nome)} quer ganhar:</b>\n${esc(p.amigo.desejos)}` : `${esc(p.amigo.nome)} ainda não escreveu a lista de desejos. Volte a este link mais tarde.`}</div>
          <button class="sec sm" style="margin-top:12px" id="hide">Esconder</button>
        </div>`
      : `<h2>O sorteio ainda não foi feito</h2><p class="muted" style="margin:0">Quando o organizador sortear, volte a este mesmo link para ver quem você tirou.</p>`}
      ${infoLine(p)}
    </div>
    <div class="card">
      <h2>O que você quer ganhar?</h2>
      <p class="muted" style="margin-top:-6px">Quem tirar você vai ver esta lista. Dê algumas opções, tamanhos e links.</p>
      <form id="wf">
        <textarea id="w" maxlength="2000" placeholder="Ex.:\n- Livro de receitas\n- Camiseta tamanho M\n- Vinho tinto">${esc(p.desejos)}</textarea>
        <button class="full" type="submit">Salvar minha lista</button>
        <div id="wmsg"></div>
      </form>
    </div>
    <p class="muted" style="text-align:center">Guarde este link. Ele é só seu.</p>`;

  const show = document.getElementById("show");
  if (show) {
    show.onclick = () => { document.getElementById("cover").classList.add("hidden"); document.getElementById("result").classList.remove("hidden"); };
    document.getElementById("hide").onclick = () => { document.getElementById("result").classList.add("hidden"); document.getElementById("cover").classList.remove("hidden"); };
  }
  document.getElementById("wf").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    try { await rpc("salvar_desejos", { p_token: token, p_desejos: document.getElementById("w").value });
      document.getElementById("wmsg").innerHTML = `<div class="ok">Lista salva.</div>`; }
    catch (err) { document.getElementById("wmsg").innerHTML = `<div class="err">${esc(err.message)}</div>`; }
    btn.disabled = false;
  };
}

if (params.get("p")) renderParticipant(params.get("p"));
else if (params.get("g")) renderAdmin(params.get("g"));
else renderHome();
</script>
